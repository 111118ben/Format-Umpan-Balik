<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survei Pengguna – G1 Motorcycle Tech AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#E4E8EB;--card:#fff;--ink:#14232E;--mute:#52636F;--line:#C5CED5;--acc:#B5342A;--tan:#C9A36B;--deep:#14232E;--ok:#2E7D55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A22;--card:#182934;--ink:#E7ECEF;--mute:#9FB0BC;--line:#34495A;--deep:#0A131A}}
:root[data-theme="dark"]{--bg:#0E1A22;--card:#182934;--ink:#E7ECEF;--mute:#9FB0BC;--line:#34495A;--deep:#0A131A}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Barlow',system-ui,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{background:var(--deep);color:#fff;margin:0 -16px 20px;padding:28px 20px 22px;border-bottom:6px solid var(--acc)}
header h1{font:700 34px/1.05 'Barlow Condensed',Arial,sans-serif;margin:0 0 6px}
header p{margin:0;color:#C9D3DA;font-size:16px}
.dots{display:flex;gap:8px;margin-top:14px}.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:block}
.dots i:nth-child(1){background:#26211E}.dots i:nth-child(2){background:var(--tan)}.dots i:nth-child(3){background:#F1EEE6}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 18px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 20px;margin-bottom:16px}
h2{font:700 28px/1.1 'Barlow Condensed',Arial,sans-serif;margin:0 0 4px}
.hint{color:var(--mute);font-size:15px;margin:0 0 16px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:20px 12px;font:600 20px 'Barlow',Arial,sans-serif;cursor:pointer;text-align:center}
.role small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:4px}
.role:hover,.role:focus-visible{border-color:var(--acc);outline:none}
.f{margin:0 0 22px}.f>label,.f>.q{display:block;font-weight:600;margin-bottom:8px}.req{color:var(--acc)}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale label{position:relative;margin:0}
.scale input{position:absolute;opacity:0;inset:0;cursor:pointer}
.scale span{display:block;text-align:center;padding:12px 0;border:1.5px solid var(--line);border-radius:8px;font:700 20px 'Barlow Condensed',Arial,sans-serif}
.scale input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.scale input:focus-visible+span{outline:3px solid var(--tan)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;font-weight:400}
.opt input{margin-top:5px;accent-color:var(--acc)}
.err .q,.err>label{color:var(--acc)}.err input[type=text],.err select,.err textarea,.err .opt,.err .scale span{border-color:var(--acc)}
.nav{display:flex;gap:10px;justify-content:space-between}
button.b{border:0;border-radius:8px;padding:14px 22px;font:600 18px 'Barlow',Arial,sans-serif;cursor:pointer;background:var(--acc);color:#fff}
button.b.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.b:disabled{opacity:.6}
.msg{padding:12px 14px;border-radius:8px;margin-top:12px;font-size:15px}.msg.bad{background:#B5342A22;border:1px solid var(--acc)}.msg.ok{background:#2E7D5522;border:1px solid var(--ok)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.done{text-align:center;padding:30px 10px}.done .big{font:700 46px 'Barlow Condensed',Arial,sans-serif}
[hidden]{display:none!important}
@media (max-width:420px){.scale span{padding:10px 0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Survei Pengguna G1 Motorcycle Tech AI</h1>
  <p>SMKN 1 Sumarorong · Jurusan Teknik Sepeda Motor</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</header>
<div class="bar" aria-hidden="true"><b id="pg"></b></div>
<div id="app"></div>
</div>

<script>
/* ====== PENGATURAN: ganti dengan URL Web App Apps Script Anda ====== */
var ENDPOINT = "https://script.google.com/macros/s/XXXXXXXX/exec";

/* ====== ISI SURVEI (format JSON, mudah diubah) ====== */
var L = function(k,t){return {k:k,t:"likert",q:t+" [1-5]",req:1}};
var SURVEY = {
 siswa:{label:"Siswa",desc:"Siswa TSM pengguna dashboard",sections:[
  {title:"Tentang Anda",f:[
   {k:"nama",t:"text",q:"Nama (boleh dikosongkan)"},
   {k:"kelas",t:"select",q:"Kelas",req:1,o:["X TSM","XI TSM","XII TSM"]},
   {k:"perangkat",t:"single",q:"Perangkat yang paling sering dipakai",req:1,o:["HP milik sendiri","HP pinjam/orang tua","Komputer/laptop lab","Belum pernah memakai"]}]},
  {title:"Penilaian Anda",hint:"Pilih 1 (sangat tidak setuju) sampai 5 (sangat setuju).",f:[
   L("s1","Kuis berbasis game membuat saya lebih semangat belajar"),
   L("s2","Saya langsung tahu nilai dan kesalahan saya setelah kuis"),
   L("s3","Fitur diagnosa busi membantu saya memahami warna busi dan kondisi mesin"),
   L("s4","Absensi digital mudah dan cepat dipakai"),
   L("s5","Dashboard mudah digunakan di HP saya"),
   L("s6","Saya lebih termotivasi mengikuti evaluasi dibanding cara kertas"),
   L("s7","Saya ingin dashboard ini terus dipakai di pelajaran lain")]},
  {title:"Kendala dan saran",f:[
   {k:"kendala",t:"single",q:"Kendala internet saat memakai dashboard",req:1,o:["Tidak ada kendala","Kadang lambat","Sering putus/lambat","Tidak bisa dipakai"]},
   {k:"favorit",t:"multi",q:"Fitur yang paling Anda sukai",o:["Kuis game","Diagnosa busi (AI)","Absensi digital","Rapor/nilai","Jadwal"]},
   {k:"saran",t:"textarea",q:"Saran atau hal yang perlu diperbaiki"}]}]},
 guru:{label:"Guru",desc:"Guru dan tenaga kependidikan",sections:[
  {title:"Tentang Anda",f:[
   {k:"nama",t:"text",q:"Nama (boleh dikosongkan)"},
   {k:"peran",t:"text",q:"Mata pelajaran / jabatan",req:1}]},
  {title:"Penilaian Anda",hint:"Pilih 1 (sangat tidak setuju) sampai 5 (sangat setuju).",f:[
   L("g1","Koreksi dan umpan balik kuis menjadi jauh lebih cepat"),
   L("g2","Absensi dan rekap nilai digital meringankan pekerjaan administrasi"),
   L("g3","Data hasil belajar siswa lebih rapi dan mudah dilacak"),
   L("g4","Hasil diagnosa busi sesuai dengan penilaian saya sebagai guru/instruktur"),
   L("g5","Dashboard mudah dipelajari oleh guru lain"),
   L("g6","Dashboard meningkatkan keterlibatan siswa"),
   L("g7","Dashboard layak diterapkan di kelas atau sekolah lain")]},
  {title:"Efisiensi waktu",hint:"Perkiraan Anda, dalam menit.",f:[
   {k:"menit_lama",t:"number",q:"Waktu mengoreksi satu kuis SEBELUM memakai dashboard (menit) [menit]",req:1},
   {k:"menit_baru",t:"number",q:"Waktu mengoreksi satu kuis SESUDAH memakai dashboard (menit) [menit]",req:1},
   {k:"bersedia",t:"single",q:"Bersediakah Anda menerapkannya atau mengenalkannya ke rekan guru?",req:1,o:["Ya, sudah","Ya, bersedia","Perlu pelatihan dulu","Belum"]},
   {k:"saran",t:"textarea",q:"Saran atau hal yang perlu diperbaiki"}]}]}
};

/* ====== MESIN SURVEI ====== */
var app=document.getElementById("app"),pg=document.getElementById("pg"),role=null,step=0,t0=Date.now();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lab(q){return esc(q.replace(/\s*\[(1-5|menit)\]$/,""))}
function field(f){
 var r=f.req?' <span class="req">*</span>':'',h='<div class="f" data-k="'+f.k+'" data-req="'+(f.req?1:0)+'">';
 if(f.t==="text")h+='<label for="'+f.k+'">'+lab(f.q)+r+'</label><input type="text" id="'+f.k+'" name="'+f.k+'" maxlength="120" autocomplete="off">';
 else if(f.t==="number")h+='<label for="'+f.k+'">'+lab(f.q)+r+'</label><input type="number" id="'+f.k+'" name="'+f.k+'" min="0" max="1000" inputmode="numeric">';
 else if(f.t==="textarea")h+='<label for="'+f.k+'">'+lab(f.q)+r+'</label><textarea id="'+f.k+'" name="'+f.k+'" maxlength="800"></textarea>';
 else if(f.t==="select")h+='<label for="'+f.k+'">'+lab(f.q)+r+'</label><select id="'+f.k+'" name="'+f.k+'"><option value="">Pilih…</option>'+f.o.map(function(o){return '<option>'+esc(o)+'</option>'}).join("")+'</select>';
 else if(f.t==="likert"){h+='<div class="q">'+lab(f.q)+r+'</div><div class="scale">';for(var i=1;i<=5;i++)h+='<label><input type="radio" name="'+f.k+'" value="'+i+'" aria-label="'+i+'"><span>'+i+'</span></label>';h+='</div><div class="ends"><span>Sangat tidak setuju</span><span>Sangat setuju</span></div>'}
 else{var ty=f.t==="multi"?"checkbox":"radio";h+='<div class="q">'+lab(f.q)+r+'</div>'+f.o.map(function(o){return '<label class="opt"><input type="'+ty+'" name="'+f.k+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>'}).join("")}
 return h+'</div>';
}
function home(){
 role=null;pg.style.width="0";
 app.innerHTML='<div class="card"><h2>Anda sebagai apa?</h2><p class="hint">Survei ini singkat (±3 menit). Jawaban Anda dipakai untuk memperbaiki dashboard dan menilai dampaknya.</p><div class="roles">'+
  Object.keys(SURVEY).map(function(k){return '<button type="button" class="role" data-role="'+k+'">'+SURVEY[k].label+'<small>'+SURVEY[k].desc+'</small></button>'}).join("")+'</div></div>';
 app.querySelectorAll(".role").forEach(function(b){b.onclick=function(){start(b.dataset.role)}});
}
function start(r){
 role=r;step=0;t0=Date.now();var S=SURVEY[r].sections;
 app.innerHTML='<form id="f" novalidate>'+S.map(function(s,i){return '<div class="card sec" data-i="'+i+'" hidden><h2>'+esc(s.title)+'</h2>'+(s.hint?'<p class="hint">'+esc(s.hint)+'</p>':'<p class="hint">Langkah '+(i+1)+' dari '+S.length+'</p>')+s.f.map(field).join("")+'</div>'}).join("")+
  '<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div><div id="m"></div><div class="nav"><button type="button" class="b ghost" id="bk">Kembali</button><button type="button" class="b" id="nx">Lanjut</button></div></form>';
 document.getElementById("bk").onclick=function(){step?go(step-1):home()};
 document.getElementById("nx").onclick=next;
 go(0);
}
function go(i){
 var S=SURVEY[role].sections;step=i;
 document.querySelectorAll(".sec").forEach(function(e){e.hidden=+e.dataset.i!==i});
 document.getElementById("nx").textContent=i===S.length-1?"Kirim jawaban":"Lanjut";
 document.getElementById("m").innerHTML="";pg.style.width=((i+1)/(S.length+1)*100)+"%";window.scrollTo({top:0,behavior:"smooth"});
}
function val(el){
 var k=el.dataset.k,f=el.querySelectorAll('[name="'+k+'"]'),type=f[0].type;
 if(type==="radio")return (el.querySelector('[name="'+k+'"]:checked')||{}).value||"";
 if(type==="checkbox")return [].map.call(el.querySelectorAll('[name="'+k+'"]:checked'),function(c){return c.value}).join(", ");
 return f[0].value.trim();
}
function next(){
 var sec=document.querySelector('.sec[data-i="'+step+'"]'),ok=true,first=null;
 sec.querySelectorAll(".f").forEach(function(e){var bad=e.dataset.req==="1"&&!val(e);e.classList.toggle("err",bad);if(bad&&!first)first=e;ok=ok&&!bad});
 if(!ok){first.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("m").innerHTML='<div class="msg bad">Mohon lengkapi pertanyaan bertanda merah.</div>';return}
 if(step<SURVEY[role].sections.length-1)go(step+1);else send();
}
function payload(){
 var a={},l={};
 SURVEY[role].sections.forEach(function(s){s.f.forEach(function(f){var e=document.querySelector('.f[data-k="'+f.k+'"]');a[f.k]=val(e);l[f.k]=f.q.replace(/\s*\[menit\]$/," [menit]")})});
 return {role:role,answers:a,labels:l,hp:document.querySelector('[name="website"]').value,secs:Math.round((Date.now()-t0)/1000),sent:new Date().toISOString()};
}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"[]");localStorage.setItem(k,JSON.stringify(v))}catch(e){return []}}
function post(p){
 var c=new AbortController(),t=setTimeout(function(){c.abort()},20000);
 return fetch(ENDPOINT,{method:"POST",body:JSON.stringify(p),signal:c.signal}).then(function(r){return r.json()}).then(function(j){clearTimeout(t);if(!j.ok)throw new Error(j.error||"gagal");return j});
}
function send(){
 var p=payload(),b=document.getElementById("nx"),m=document.getElementById("m");
 if(p.hp){done(false);return}
 if(ENDPOINT.indexOf("PASTE_")===0){m.innerHTML='<div class="msg bad">URL Apps Script belum diisi pada variabel ENDPOINT.</div>';return}
 b.disabled=true;b.textContent="Mengirim…";
 post(p).then(function(){done(true)}).catch(function(){
  var q=store("g1q");q.push(p);store("g1q",q);b.disabled=false;done(false,true)});
}
function done(ok,queued){
 pg.style.width="100%";
 app.innerHTML='<div class="card done"><div class="big">'+(queued?"Tersimpan di perangkat":"Terima kasih!")+'</div><p>'+(queued?"Koneksi sedang bermasalah. Jawaban Anda disimpan dan akan dikirim otomatis saat internet kembali (buka halaman ini lagi).":"Jawaban Anda sudah terkirim dan sangat membantu pengembangan G1 Motorcycle Tech AI.")+'</p><button type="button" class="b" id="again">Isi untuk responden berikutnya</button></div>';
 document.getElementById("again").onclick=home;
}
function flush(){
 var q=store("g1q");if(!q.length||ENDPOINT.indexOf("PASTE_")===0)return;
 var rest=[],chain=Promise.resolve();
 q.forEach(function(p){chain=chain.then(function(){return post(p)}).catch(function(){rest.push(p)})});
 chain.then(function(){store("g1q",rest)});
}
addEventListener("online",flush);flush();
var qr=new URLSearchParams(location.search).get("role");
if(qr&&SURVEY[qr])start(qr);else home();
</script>
</body>
</html>
